<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WorldEd — Global University & Institution Search</title>
  <meta name="description" content="Discover and research universities, colleges, institutes, medical schools and academies worldwide with transparent, sourced information." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>&#127979;</text></svg>" />
  <link rel="preconnect" href="https://picsum.photos" crossorigin />
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin />

  <!-- Leaflet (interactive maps) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Tailwind (CDN). Colors map to HSL tokens in styles.css (shadcn-style). -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            background: "hsl(var(--background) / <alpha-value>)",
            foreground: "hsl(var(--foreground) / <alpha-value>)",
            card: "hsl(var(--card) / <alpha-value>)",
            "card-foreground": "hsl(var(--card-foreground) / <alpha-value>)",
            popover: "hsl(var(--popover) / <alpha-value>)",
            "popover-foreground": "hsl(var(--popover-foreground) / <alpha-value>)",
            primary: "hsl(var(--primary) / <alpha-value>)",
            "primary-foreground": "hsl(var(--primary-foreground) / <alpha-value>)",
            secondary: "hsl(var(--secondary) / <alpha-value>)",
            "secondary-foreground": "hsl(var(--secondary-foreground) / <alpha-value>)",
            muted: "hsl(var(--muted) / <alpha-value>)",
            "muted-foreground": "hsl(var(--muted-foreground) / <alpha-value>)",
            accent: "hsl(var(--accent) / <alpha-value>)",
            "accent-foreground": "hsl(var(--accent-foreground) / <alpha-value>)",
            destructive: "hsl(var(--destructive) / <alpha-value>)",
            border: "hsl(var(--border) / <alpha-value>)",
            input: "hsl(var(--input) / <alpha-value>)",
            ring: "hsl(var(--ring) / <alpha-value>)"
          },
          borderRadius: {
            lg: "var(--radius)",
            md: "calc(var(--radius) - 2px)",
            sm: "calc(var(--radius) - 4px)"
          }
        }
      }
    };
  </script>

  <script>
    /* Apply saved/system theme before first paint. */
    (function () {
      var t = null;
      try { t = localStorage.getItem("worlded.theme"); } catch (e) {}
      var dark = t ? t === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
      if (dark) document.documentElement.classList.add("dark");
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
    })();
  </script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-background text-foreground">

  <header class="topbar" id="topbar">
    <a class="brand" href="#/" aria-label="WorldEd home">
      <span class="dot"></span>
      WorldEd
      <span class="hidden sm:inline text-[0.65rem] font-medium text-muted-foreground tracking-normal">Global institution search</span>
    </a>
    <div class="flex items-center gap-2 flex-1 justify-end">
      <div id="top-search-wrap" class="search-field hidden md:block flex-1 max-w-md">
        <input id="top-search" class="input" type="text" placeholder="Search institutions, cities, countries&hellip;" autocomplete="off" spellcheck="false" />
        <div id="top-dropdown" class="hidden" role="listbox"></div>
      </div>
      <a href="#/map" class="btn btn-ghost btn-icon" aria-label="World map" title="Map">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15"/><path d="M15 6v15"/></svg>
      </a>
      <a href="#/explore" class="btn btn-ghost btn-icon" aria-label="World explorer" title="World explorer">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
      </a>
      <button id="theme-toggle" class="btn btn-ghost btn-icon" aria-label="Toggle light/dark theme" type="button">
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </div>
  </header>

  <main id="app"></main>

  <footer class="py-8 px-4 text-center text-xs text-muted-foreground">
    WorldEd — demo build with mock data. Sources, confidence and verification are simulated for illustration.
    Real deployments must proxy API keys server-side and follow each provider's terms and attribution rules.
  </footer>

  <noscript>
    <p style="padding: 5rem 1rem; text-align: center">WorldEd needs JavaScript to run.</p>
  </noscript>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="search.js"></script>
  <script src="app.js"></script>
</body>
</html>
